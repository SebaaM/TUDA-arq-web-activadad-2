services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - 5432:5432
    volumes:
      - untdf-pgdata:/var/lib/postgresql/data
    networks:
      - untdf-app
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8000:8000
    volumes:
      - ./backend:/app
    networks:
      - untdf-app

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_PROXY_TARGET: "${VITE_PROXY_TARGET}"
    depends_on:
      - api
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
    networks:
      - untdf-app

volumes:
  untdf-pgdata:

networks:
  untdf-app:
