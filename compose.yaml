services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - untdf-pgdata-target:/var/lib/postgresql/data
    networks:
      - untdf-app
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,api"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - untdf-app
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/activities/', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    build:
      context: ./frontend
      dockerfile: dockerfile
      target: production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - untdf-app

volumes:
  untdf-pgdata-target:

networks:
  untdf-app:
